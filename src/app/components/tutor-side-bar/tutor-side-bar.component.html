<div class="sidebar">

    <!-- Logo -->
    <div class="logo">

        <h2>DEUTSCH</h2>

        <span>ASSESS</span>

    </div>


    <!-- Navigation -->
    <ul class="nav-links">

        <!-- Students -->
        <li
            routerLink="/tutor-student-list"
            routerLinkActive="active">

            <mat-icon>
                groups
            </mat-icon>

            <span>
                Students
            </span>

        </li>


        <!-- Classes -->
        <li
            routerLink="/tutor-classes"
            routerLinkActive="active">

            <mat-icon>
                calendar_month
            </mat-icon>

            <span>
                Classes
            </span>

        </li>


        <!-- Assessments -->
        <li
            routerLink="/tutor-assessments"
            routerLinkActive="active">

            <mat-icon>
                quiz
            </mat-icon>

            <span>
                Assessments
            </span>

        </li>

        <!-- Results -->
        <li
            routerLink="/tutor-results"
            routerLinkActive="active">

            <mat-icon>
                bar_chart
            </mat-icon>

            <span>
                Results
            </span>

        </li>


        <!-- Profile -->
        <li
            routerLink="/tutor/profile"
            routerLinkActive="active">

            <mat-icon>
                account_circle
            </mat-icon>

            <span>
                Profile
            </span>

        </li>

    </ul>


    <!-- Logout -->
    <div class="logout-section">

        <li
            class="logout"
            (click)="logout()">

            <mat-icon>
                logout
            </mat-icon>

            <span>
                Logout
            </span>

        </li>

    </div>

</div>
