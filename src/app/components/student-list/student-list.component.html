<div class="dashboard-container">

    <!-- Sidebar -->
    <app-admin-navbar></app-admin-navbar>

    <!-- Main Content -->
    <div class="content">

        <div class="page-container">

            <mat-card class="student-card">

                <div class="header">

                    <div>

                        <h2>Student Management</h2>

                        <p>Manage all registered students</p>

                    </div>

                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/signup">

                        <mat-icon>person_add</mat-icon>

                        Register New Student

                    </button>

                </div>

                <div class="search-box">

                    <mat-form-field appearance="outline">

                        <mat-label>Search Student</mat-label>

                        <input
                            matInput
                            placeholder="Search by Reg No or Name">

                        <mat-icon matSuffix>search</mat-icon>

                    </mat-form-field>

                </div>

                <div class="table-responsive">

                    <table mat-table [dataSource]="students" class="mat-elevation-z0">

                        <!-- Reg No -->
                        <ng-container matColumnDef="regNo">

                            <th mat-header-cell *matHeaderCellDef>Reg No</th>

                            <td mat-cell *matCellDef="let student">
                                {{student.regNo}}
                            </td>

                        </ng-container>

                        <!-- Name -->
                        <ng-container matColumnDef="name">

                            <th mat-header-cell *matHeaderCellDef>Name</th>

                            <td mat-cell *matCellDef="let student">
                                {{student.firstName}} {{student.lastName}}
                            </td>

                        </ng-container>

                        <!-- Email -->
                        <ng-container matColumnDef="email">

                            <th mat-header-cell *matHeaderCellDef>Email</th>

                            <td mat-cell *matCellDef="let student">
                                {{student.email}}
                            </td>

                        </ng-container>

                        <!-- Plan -->
                        <ng-container matColumnDef="plan">

                            <th mat-header-cell *matHeaderCellDef>Plan</th>

                            <td mat-cell *matCellDef="let student">

                                {{student.plan}}

                            </td>

                        </ng-container>

                        <!-- Status -->
                        <ng-container matColumnDef="status">

                            <th mat-header-cell *matHeaderCellDef>Status</th>

                            <td mat-cell *matCellDef="let student">

                                <span
                                    class="status"
                                    [ngClass]="student.status.toLowerCase()">

                                    {{student.status}}

                                </span>

                            </td>

                        </ng-container>

                        <!-- Level -->
                        <ng-container matColumnDef="level">

                            <th mat-header-cell *matHeaderCellDef>Level</th>

                            <td mat-cell *matCellDef="let student">

                                {{student.assignedCourses.join(', ')}}

                            </td>

                        </ng-container>

                        <!-- Actions -->
                        <ng-container matColumnDef="actions">

                            <th mat-header-cell *matHeaderCellDef>Actions</th>

                            <td mat-cell *matCellDef="let student">

                                <button
                                    mat-mini-fab
                                    color="primary">

                                    <mat-icon>edit</mat-icon>

                                </button>

                                <button
                                    mat-mini-fab
                                    color="accent"
                                    class="ms-2">

                                    <mat-icon>update</mat-icon>

                                </button>

                            </td>

                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    </table>

                </div>

            </mat-card>

</div>
